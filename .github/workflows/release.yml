name: Release packages to npm

on:
  push:
    branches:
      - main
  # Publishing is gated on release-please's output, so anything that fails the
  # job after the tag and GitHub release exist strands the version: rerunning
  # finds the release already made and reports nothing to publish. This is the
  # way back — dispatch against the release tag to publish it as it stands, with
  # no dummy commit to bump past it.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages/sdk from the selected ref, skipping release-please"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # Lets the job mint the OIDC token npm exchanges for publish rights, and
  # sign the provenance attestation.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # No `token:` here on purpose. The built-in GITHUB_TOKEN is enough
      # because the publish happens in this same job — nothing needs the
      # release event to start another workflow. It also cannot expire, which
      # a personal access token does.
      #
      # The tradeoff: a branch pushed with GITHUB_TOKEN does not trigger
      # workflows, so ci.yml will not run on the release PR. If that matters,
      # swap in a GitHub App token (actions/create-github-app-token) rather
      # than going back to a PAT.
      - uses: googleapis/release-please-action@v4
        id: release
        if: github.event_name == 'push'
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        # everything below runs only for an actual publication — a new release,
        # or a manual dispatch asking for one
        if: ${{ steps.release.outputs.releases_created || inputs.publish }}
      # No registry-url here on purpose. It makes setup-node write
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc; with
      # no token that expands to empty, npm reads the line as "auth is already
      # configured" and never starts the OIDC exchange, failing with E404.
      # See actions/setup-node#1551 and npm/documentation#1960.
      # npm defaults to registry.npmjs.org anyway.
      - uses: actions/setup-node@v4
        with:
          # 24.x ships npm 11.17.x; trusted publishing needs >= 11.5.1
          node-version: 24
        if: ${{ steps.release.outputs.releases_created || inputs.publish }}
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock', '.yarnrc.yml') }}
        if: ${{ steps.release.outputs.releases_created || inputs.publish }}
      - run: yarn
        if: ${{ steps.release.outputs.releases_created || inputs.publish }}
      - name: Build packages
        run: |
          yarn run build:evm
          yarn run build:sdk
        if: ${{ steps.release.outputs.releases_created || inputs.publish }}

      # `yarn npm publish` substituted `workspace:` ranges on the way out.
      # `npm publish` does not, and it is npm that speaks OIDC, so do the
      # substitution ourselves before handing the package over.
      - name: Resolve workspace ranges in the sdk manifest
        run: node scripts/resolve-workspace-ranges.mjs packages/sdk
        if: ${{ steps.release.outputs['packages/sdk--release_created'] || inputs.publish }}
      # Authenticates via OIDC against the trusted publisher configured at
      # npmjs.com/package/zodiac-roles-sdk/access. No npm token involved; the
      # binding is to this repo + this workflow filename, so renaming this file
      # means updating that setting.
      - name: Publish sdk package to npm
        working-directory: ./packages/sdk
        run: npm publish --provenance
        if: ${{ steps.release.outputs['packages/sdk--release_created'] || inputs.publish }}
